<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0D3A5C">
  <title>Create Something</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a href="https://instagram.com/dlvyne" class="floating-logo" target="_blank" rel="noopener" aria-label="Instagram @dlvyne">
    <img src="https://res.cloudinary.com/pav3kc8d/image/upload/f_auto,q_auto/DDDDV-05.png" alt="">
  </a>

  <header class="top">
    <h1>Create Something Case</h1>
    <p class="subtitle"></p>
  </header>

  <main>

    <!-- LANE 1: DESIGN THEME
         .band  = full-width glass strip that holds the reel
         .plate = glass panel with the result and the Roll button
         JS finds each lane through data-lane. -->
    <section class="lane" data-lane="theme" aria-labelledby="themeTitle">
      <div class="band">
        <div class="reel" aria-hidden="true"><div class="reel-track"></div></div>
        <span class="marker" aria-hidden="true"></span>
      </div>

      <div class="plate">
        <span class="rarity-tag"></span>
        <h2 id="themeTitle">Theme</h2>
        <p class="result is-empty" aria-live="polite">No theme selected yet.</p>
        <p class="hint">Press "Roll" to get a theme.</p>
        <div class="foot">
          <button class="btn" type="button" data-roll="theme" aria-disabled="false">Roll</button>
          <p class="last"></p>
        </div>
      </div>
    </section>

    <!-- LANE 2: COLOR PALETTE -->
    <section class="lane" data-lane="palette" aria-labelledby="paletteTitle">
      <div class="band">
        <div class="reel" aria-hidden="true"><div class="reel-track"></div></div>
        <span class="marker" aria-hidden="true"></span>
      </div>

      <div class="plate plate--palette">
        <span class="rarity-tag"></span>
        <h2 id="paletteTitle">Color palette</h2>
        <!-- Empty placeholders; JS swaps in the real swatches -->
        <div class="swatches">
          <span class="swatch is-empty"></span><span class="swatch is-empty"></span>
          <span class="swatch is-empty"></span><span class="swatch is-empty"></span>
        </div>
        <p class="result is-empty" aria-live="polite">No palette selected yet.</p>
        <p class="hint">Press "Roll" to get a color palette.</p>
        <div class="foot">
          <button class="btn" type="button" data-roll="palette" aria-disabled="false">Roll</button>
          <p class="last"></p>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>V2.1</p>
  </footer>

  <noscript><p class="noscript">This page needs JavaScript to roll.</p></noscript>
  <script src="script.js"></script>
</body>
</html>
